{% load static %}

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="{% static 'css/bootstrap/css/bootstrap.css' %}" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/fontawesome/css/all.css' %}" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="container-fluid">
        <div class="row row-cols-2">
            <div class="col">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Студенты по факультетам</h5>
                        <div class="chart-container">
                            <canvas id="pieChart"></canvas>
                            <div class="dataPie" id="pieData"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Количество Должников</h5>
                        <div class="chart-container">
                            <canvas id="barChart"></canvas>
                            <div class="data" id="barData"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <h5 class="card-title">Тенденция оценок</h5>
            <div class="mark-container">
                <div class="message-container d-flex align-items-center justify-content-center mx-auto mt-auto"></div>
                <div class="col">
                    <canvas id="markChart"></canvas>
                </div>
            </div>
            <div class="col">
                <form id="chartForm">
                    <div class="mb-3">
                        <label for="iinInput" class="form-label">ИИН:</label>
                        <input type="text" class="form-control" id="iinInput" name="iin">
                    </div>
                    <div class="mb-3">
                        <label for="dateRangeSelect" class="form-label">Выберите диапазон дат:</label>
                        <select class="form-select" id="dateRangeSelect" name="date_range">
                            <option value="1">На 1 день</option>
                            <option value="7" selected>На 7 дней</option>
                            <option value="30">На 30 дней</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Отправить </button>
                </form>
            </div>
        </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
    integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
    crossorigin="anonymous"></script>
<script defer src="{% static 'js/minechart.js' %}"></script>

</html>
