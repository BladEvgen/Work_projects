{% extends "components/base.html" %}
{% load static %}
{% block title %} Get Comments {% endblock title %}
{% block main %}
<style>
    .container {
        border: none !important;
    }

    .card {
        border-radius: 15px;
    }

    .btn {
        transition: all 0.3s ease;
    }

    .btn:hover {
        transform: scale(1.05);
    }
</style>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card text-white bg-dark mb-3 shadow-lg">
                <div class="card-header text-center">
                    <h3><i class="fas fa-download text-warning"></i> Скачать Рэйтинг преподавателей</h3>
                </div>
                <div class="card-body">
                    <p class="card-text text-center">Выберите тип рейтинга, который вы хотите скачать:</p>
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-outline-primary download-btn" data-comments="true">
                            <i class="fas fa-comments"></i> Рэйтинг с комментариями
                        </button>
                        <button type="button" class="btn btn-outline-success download-btn" data-comments="false">
                            <i class="fas fa-comment-slash"></i> Рэйтинг без комментариев
                        </button>
                    </div>
                </div>
            </div>
            <div id="status" class="alert mt-3" role="alert" style="display: none;"></div>
        </div>
    </div>
</div>
{% endblock main %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const downloadButtons = document.querySelectorAll('.download-btn');

        downloadButtons.forEach(function (button) {
            button.addEventListener('click', function () {
                const commentsEnabled = button.getAttribute('data-comments') === 'true';
                console.log('Нажата кнопка: ', button.textContent);
                console.log('Параметр comments_enabled: ', commentsEnabled);

                generateFile(commentsEnabled);
            });
        });

        async function generateFile(commentsEnabled) {
            const status = document.getElementById('status');
            const downloadButtons = document.querySelectorAll('.download-btn');
            downloadButtons.forEach(btn => btn.disabled = true);

            try {
                console.log('Отправка запроса на сервер для генерации файла...');
                status.className = 'alert alert-primary';
                status.textContent = 'Генерация файла начата...';
                status.style.display = 'block';

                const response = await fetch(`/get_comments/?comments_enabled=${commentsEnabled}`);
                if (!response.ok) {
                    throw new Error('Ошибка при загрузке файла');
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = commentsEnabled ? 'tutor_rating_comments.xlsx' : 'tutor_rating.xlsx';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                console.log('Файл успешно загружен');
                status.className = 'alert alert-success';
                status.textContent = 'Файл успешно сгенерирован и загружен';
                setTimeout(() => {
                    status.style.display = 'none';
                    downloadButtons.forEach(btn => btn.disabled = false);
                }, 3000);
            } catch (error) {
                console.error(error);
                status.className = 'alert alert-danger';
                status.textContent = 'Обратитесь к Администратору';
                status.style.display = 'block';
                downloadButtons.forEach(btn => btn.disabled = false);
            }
        }
    });
</script>
{% endblock scripts %}
