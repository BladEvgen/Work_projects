{% load static %}

<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{% static 'css/bootstrap/css/bootstrap.css' %}" />
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  <link rel="stylesheet" href="{% static 'css/fontawesome/css/all.css' %}" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>Tutors Diagram</title>
</head>

<body>
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-6">
        <div class="card">
          <div class="card-body p-0">
            <h5 class="card-title">Ученое звание</h5>
            <div class="chart-container w-50">
              <canvas id="nameRuChart"></canvas>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card">
          <div class="card-body p-0">
            <h5 class="card-title">Ставки</h5>
            <div class="chart-container w-50">
              <canvas id="rateChart"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="row mt-4">
      <div class="col">
        <div class="card">
          <div class="card-body m-0 p-0">
            <h5 class="card-title">Тенденция кафедр</h5>
            <div class="chart-container w-100">
              <canvas id="cafedraChart"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

<script>
  function generateColor(existingColors, similarity) {
    function random(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    let r, g, b;
    let maxAttempts = 100;
    let attempt = 0;

    do {
      r = random(0, 255);
      g = random(0, 255);
      b = random(0, 255);
      attempt++;
    } while (attempt < maxAttempts && existingColors.some(color => colorSimilarity(color, `rgba(${r}, ${g}, ${b}, 1)`) >= similarity));

    return `rgba(${r}, ${g}, ${b}, 1)`;
  }

  function colorSimilarity(color1, color2) {
    let [r1, g1, b1] = color1.match(/\d+/g).map(Number);
    let [r2, g2, b2] = color2.match(/\d+/g).map(Number);

    let deltaR = Math.abs(r1 - r2);
    let deltaG = Math.abs(g1 - g2);
    let deltaB = Math.abs(b1 - b2);

    return 1 - ((deltaR + deltaG + deltaB) / (255 * 3));
  }

  fetch('https://platonus-mark.medkrmu.kz/dashboard/tutors')
    .then(response => response.json())
    .then(data => {
      console.log(data);

      const filteredData = data.data.filter(item => item.has_access === "1");

      const cafedraCounts = {};
      filteredData.forEach(item => {
        cafedraCounts[item.cafedraNameRu] = (cafedraCounts[item.cafedraNameRu] || 0) + 1;
      });

      const cafedraChartCanvas = document.getElementById('cafedraChart');
      const cafedraChartCtx = cafedraChartCanvas.getContext('2d');

      const sortedCafedraNames = Object.keys(cafedraCounts).sort();
      const sortedCafedraData = sortedCafedraNames.map(name => cafedraCounts[name]);

      const cafedraChart = new Chart(cafedraChartCtx, {
        type: 'bar',
        data: {
          labels: sortedCafedraNames,
          datasets: [{
            label: 'Кафедры',
            data: sortedCafedraData,
            backgroundColor: sortedCafedraNames.map(() => generateColor([], 0.3)),
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: {
              beginAtZero: true
            }
          },
          plugins: {
            legend: {
              display: true,
            }
          }
        }
      });

      const nameRuCounts = {};
      filteredData.forEach(item => {
        const name = (item.nameRu === "—" ? "Преподаватель" : item.nameRu);
        nameRuCounts[name] = (nameRuCounts[name] || 0) + 1;
      });

      const nameRuChartCtx = document.getElementById('nameRuChart').getContext('2d');
      const nameRuChart = new Chart(nameRuChartCtx, {
        type: 'doughnut',
        data: {
          labels: Object.keys(nameRuCounts),
          datasets: [{
            label: 'Колличество',
            data: Object.values(nameRuCounts),
            backgroundColor: Object.keys(nameRuCounts).map(() => generateColor([], 0.6)),
          }]
        },
        options: {
          plugins: {
            tooltip: {
              callbacks: {
                label: function (context) {
                  let label = context.label || '';
                  if (label) {
                    label += ': ';
                  }
                  label += context.raw + ' чел.';
                  return label;
                }
              }
            }
          },
          legend: {
            display: true,
          }
        }
      });

      const rateChartCtx = document.getElementById('rateChart').getContext('2d');

      const rateGroups = {};
      filteredData.forEach(item => {
        const rate = parseFloat(item.rate);
        if (rate > 0) {
          if (!rateGroups[rate]) {
            rateGroups[rate] = 0;
          }
          rateGroups[rate]++;
        }
      });

      const sortedKeys = Object.keys(rateGroups).map(parseFloat).sort((a, b) => a - b);

      const sortedRateGroupsNumeric = {};
      sortedKeys.forEach(key => {
        sortedRateGroupsNumeric[key] = rateGroups[key];
      });

      const rateChart = new Chart(rateChartCtx, {
        type: 'pie',
        data: {
          labels: Object.keys(sortedRateGroupsNumeric).map(rate => rate.toString()),
          datasets: [{
            label: 'Колличество',
            data: Object.values(sortedRateGroupsNumeric),
            backgroundColor: Object.keys(sortedRateGroupsNumeric).map(() => generateColor([], 0.5)),
          }]
        },
        options: {
          plugins: {
            tooltip: {
              callbacks: {
                label: function (context) {
                  let label = context.label || '';
                  if (label) {
                    label += ': ';
                  }
                  label += context.raw + ' чел. (' + context.parsed + '%)';
                  return label;
                }
              }
            }
          },
          legend: {
            display: true,
          }
        }
      });
    })
    .catch(error => {
      console.error('Ошибка:', error);
    });

</script>

</html>
