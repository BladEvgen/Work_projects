{% load static %}

<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{% static 'css/bootstrap/css/bootstrap.css' %}" />
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  <link rel="stylesheet" href="{% static 'css/fontawesome/css/all.css' %}" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>Tutors Diagram</title>
</head>

<body>
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-4">
        <canvas id="donutChart"></canvas>
      </div>
      <div class="col-md-8">
        <canvas id="barChart"></canvas>
      </div>
    </div>
  </div>
</body>
<script>
  let generatedColors = [];

  function generateColor() {
    function random(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    let r = random(0, 255);
    let g = random(0, 255);
    let b = random(0, 255);

    if ((r > 200 && g > 200 && b > 200) || (r < 100 && g < 100 && b < 100)) {
      return generateColor();
    }

    for (let color of generatedColors) {
      let [oldR, oldG, oldB] = color.match(/\d+/g).map(Number);
      if (
        Math.abs(r - oldR) + Math.abs(g - oldG) + Math.abs(b - oldB) <
        255 * 0.05
      ) {
        return generateColor();
      }
    }

    let newColor = `rgba(${r}, ${g}, ${b}, ${random(35, 60) / 100})`;
    generatedColors.push(newColor);

    return newColor;
  }

  fetch('https://platonus-mark.medkrmu.kz/dashboard/tutors')
    .then(response => response.json())
    .then(data => {
      let cafedraCounts = {};
      let nameRuCounts = {};

      data.data.forEach(tutor => {
        if (tutor.has_access === "1") {
          cafedraCounts[tutor.cafedraNameRu] = (cafedraCounts[tutor.cafedraNameRu] || 0) + 1;
          nameRuCounts[tutor.nameRu === "—" ? "Преподаватель" : tutor.nameRu] = (nameRuCounts[tutor.nameRu === "—" ? "Преподаватель" : tutor.nameRu] || 0) + 1;
        }
      });

      let donutChartCanvas = document.getElementById('donutChart').getContext('2d');
      let donutChart = new Chart(donutChartCanvas, {
        type: 'doughnut',
        data: {
          labels: Object.keys(nameRuCounts),
          datasets: [{
            data: Object.values(nameRuCounts),
            backgroundColor: Object.keys(nameRuCounts).map(() => generateColor())
          }]
        }
      });

      let barChartCanvas = document.getElementById('barChart').getContext('2d');
      let barChart = new Chart(barChartCanvas, {
        type: 'bar',
        data: {
          labels: Object.keys(cafedraCounts),
          datasets: [{
            label: 'Количество',
            data: Object.values(cafedraCounts),
            backgroundColor: Object.keys(cafedraCounts).map(() => generateColor())
          }]
        },
        options: {
          scales: {
            yAxes: [{
              ticks: {
                beginAtZero: true
              }
            }]
          }
        }
      });
    })
    .catch(error => {
      console.error('Ошибка:', error);
    });
</script>

</html>
