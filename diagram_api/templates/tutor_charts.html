{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{% static 'css/bootstrap/css/bootstrap.css' %}" />
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  <link rel="stylesheet" href="{% static 'css/fontawesome/css/all.css' %}" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>Tutors Diagram</title>
  <style>
    .legend-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .legend-item {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      margin-right: 20px;
      margin-bottom: 10px;
      max-width: calc(33% - 10px);
    }

    .legend-item span {
      flex-shrink: 0;
    }

    .legend-color {
      width: 15px;
      height: 15px;
      margin-right: 5px;
      border-radius: 50%;
    }

    @media (max-width: 767.98px) {
      .legend-item {
        max-width: 100%;
      }
    }

    @media (min-width: 768px) and (max-width: 991.98px) {
      .legend-item {
        max-width: calc(50% - 10px);
      }
    }

    @media (min-width: 992px) and (max-width: 1199.98px) {}

    @media (min-width: 1200px) and (max-width: 1439.98px) {}

    @media (min-width: 1440px) and (max-width: 1919.98px) {

      .legend-item span,
      strong {
        font-size: 16px;
      }
    }

    @media (min-width: 1920px) {

      .legend-item span,
      strong {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-3">
        <div class="card">
          <div class="card-body p-0">
            <h5 class="card-title">Ученое звание</h5>
            <div class="chart-container">
              <canvas id="nameRuChart"></canvas>
            </div>
            <div class="legend-container" id="nameRuChartLegend"></div>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card">
          <div class="card-body p-0">
            <h5 class="card-title">Ставки</h5>
            <div class="chart-container">
              <canvas id="rateChart"></canvas>
            </div>
            <div class="legend-container" id="rateChartLegend"></div>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card">
          <div class="card-body p-0">
            <h5 class="card-title">Тенденция возраста у преподавателей</h5>
            <div class="chart-container">
              <canvas id="yearsChart"></canvas>
            </div>
            <div class="legend-container" id="yearsChartLegend"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="row mt-4">
      <div class="col-lg-12">
        <div class="card">
          <div class="card-body m-0 p-0 ">
            <h5 class="card-title">Тенденция кафедр</h5>
            <div class="chart-container vh-100">
              <canvas id="cafedraChart"></canvas>
            </div>
            <div class="legend-container" id="cafedraChartLegend" style="display: none;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
<script>
  async function fetchData(url) {
    const response = await fetch(url);
    return response.json();
  }
  async function countUniqueAges(filteredData) {
    const uniqueAges = new Set();

    filteredData.forEach(item => {
      const birthDate = new Date(item.birthDate);
      const currentDate = new Date();
      const age = currentDate.getFullYear() - birthDate.getFullYear();
      uniqueAges.add(age);
    });

    console.log('Количество уникальных возрастов:', uniqueAges.size);
  }
  async function generateCharts() {
    try {
      const data = await fetchData('https://platonus-mark.medkrmu.kz/dashboard/tutors');

      console.log(data);

      const filteredData = data.data.filter(item => item.has_access === "1");

      await generateCafedraChart(filteredData);
      await generateNameRuChart(filteredData);
      await generateRateChart(filteredData);
      await generateYearsChart(filteredData);
      await countUniqueAges(filteredData);


    } catch (error) {
      console.error('Ошибка:', error);
    }
  }

  async function generateCafedraChart(filteredData) {
    const cafedraCounts = {};
    filteredData.forEach(item => {
      cafedraCounts[item.cafedraNameRu] = (cafedraCounts[item.cafedraNameRu] || 0) + 1;
    });

    const cafedraChartCanvas = document.getElementById('cafedraChart');
    const cafedraChartCtx = cafedraChartCanvas.getContext('2d');

    const sortedCafedraNames = Object.keys(cafedraCounts).sort().reverse();
    const sortedCafedraData = sortedCafedraNames.map(name => cafedraCounts[name]);

    const cafedraChart = new Chart(cafedraChartCtx, {
      type: 'bar',
      data: {
        labels: sortedCafedraNames,
        datasets: [{
          label: 'Кафедры',
          data: sortedCafedraData,
          backgroundColor: sortedCafedraNames.map(() => generateColor([], 0.5)),
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: {
            beginAtZero: true
          }
        },
        plugins: {
          legend: {
            display: true,
          }
        }
      }
    });

    const cafedraChartLegend = document.getElementById('cafedraChartLegend');
    sortedCafedraNames.forEach((name, index) => {
      const color = cafedraChart.data.datasets[0].backgroundColor[index];
      cafedraChartLegend.innerHTML += `<div class="legend-item"><span class="legend-color" style="background-color: ${color}"></span>${name}: <strong>${cafedraCounts[name]} чел.</strong></div>`;
    });
  }

  async function generateNameRuChart(filteredData) {
    const nameRuCounts = {};
    filteredData.forEach(item => {
      const name = (item.nameRu === "—" ? "Преподаватель" : item.nameRu);
      nameRuCounts[name] = (nameRuCounts[name] || 0) + 1;
    });

    const nameRuChartCtx = document.getElementById('nameRuChart').getContext('2d');
    const nameRuChart = new Chart(nameRuChartCtx, {
      type: 'doughnut',
      data: {
        labels: Object.keys(nameRuCounts),
        datasets: [{
          label: 'Колличество',
          data: Object.values(nameRuCounts),
          backgroundColor: [
            "rgba(54, 162, 235, 0.8)",
            "rgba(255, 206, 86, 0.8)",
            "rgba(75, 192, 192, 0.8)",
            "rgba(255, 99, 132, 1)",
            "rgba(255, 159, 64, 0.8)",
          ],
        }]
      },
      options: {
        plugins: {
          tooltip: {
            enabled: false
          }
        },
        legend: {
          display: true,
        }
      }
    });

    const nameRuChartLegend = document.getElementById('nameRuChartLegend');
    Object.keys(nameRuCounts).forEach((name, index) => {
      const color = nameRuChart.data.datasets[0].backgroundColor[index];
      nameRuChartLegend.innerHTML += `<div class="legend-item"><span class="legend-color" style="background-color: ${color}"></span>${name}: <strong>${nameRuCounts[name]} чел. (${((nameRuCounts[name] / filteredData.length) * 100).toFixed(2)}%)</strong></div>`;
    });
  }

  async function generateRateChart(filteredData) {
    const rateGroups = {};
    filteredData.forEach(item => {
      const rate = parseFloat(item.rate);
      if (rate > 0) {
        if (!rateGroups[rate]) {
          rateGroups[rate] = 0;
        }
        rateGroups[rate]++;
      }
    });

    const sortedKeys = Object.keys(rateGroups).map(parseFloat).sort((a, b) => a - b);

    const sortedRateGroupsNumeric = {};
    sortedKeys.forEach(key => {
      sortedRateGroupsNumeric[key] = rateGroups[key];
    });

    const rateChartCtx = document.getElementById('rateChart').getContext('2d');

    const rateChart = new Chart(rateChartCtx, {
      type: 'pie',
      data: {
        labels: Object.keys(sortedRateGroupsNumeric).map(rate => rate.toString()),
        datasets: [{
          label: 'Колличество',
          data: Object.values(sortedRateGroupsNumeric),
          backgroundColor: [
            "rgba(255, 99, 71, 0.8)",   // Томатный
            "rgba(255, 165, 0, 0.8)",   // Оранжевый
            "rgba(255, 20, 147, 0.8)",   // Глубокий розовый
            "rgba(70, 130, 180, 1)",    // Стальной голубой
            "rgba(218, 112, 214, 0.8)", // Фуксия
            "rgba(173, 255, 47, 0.8)",  // Зеленый желтоватый
          ],
        }]
      },
      options: {
        plugins: {
          tooltip: {
            enabled: false
          }
        },
        legend: {
          display: true,
        }
      }
    });

    const rateChartLegend = document.getElementById('rateChartLegend');
    Object.keys(sortedRateGroupsNumeric).forEach((rate, index) => {
      const color = rateChart.data.datasets[0].backgroundColor[index];
      rateChartLegend.innerHTML += `<div class="legend-item"><span class="legend-color" style="background-color: ${color}"></span>Ставка ${rate}:<strong> ${sortedRateGroupsNumeric[rate]} чел. (${((sortedRateGroupsNumeric[rate] / filteredData.length) * 100).toFixed(2)}%)</div></strong>`;
    });
  }

  async function generateYearsChart(filteredData) {
    const yearsCounts = {};

    filteredData.forEach(item => {
      const birthDate = new Date(item.birthDate);
      const currentDate = new Date();
      const age = currentDate.getFullYear() - birthDate.getFullYear();

      if (!yearsCounts[age]) {
        yearsCounts[age] = 0;
      }
      yearsCounts[age]++;
    });

    const sortedYears = Object.keys(yearsCounts).sort((a, b) => a - b);
    const yearsData = sortedYears.map(year => yearsCounts[year]);

    const yearsChartCanvas = document.getElementById('yearsChart');
    const yearsChartCtx = yearsChartCanvas.getContext('2d');

    const yearsChart = new Chart(yearsChartCtx, {
      type: 'line',
      data: {
        labels: sortedYears,
        datasets: [{
          label: 'Количество преподавателей',
          data: yearsData,
          borderColor: 'rgba(255, 99, 132, 1)',
          backgroundColor: 'rgba(255, 99, 132, 0.2)',
        }]
      },
      options: {
        responsive: true,
        scales: {
          x: {
            title: {
              display: true,
              text: 'Возраст преподавателей'
            }
          },
          y: {
            title: {
              display: true,
              text: 'Количество преподавателей'
            },
            beginAtZero: true
          }
        },
        plugins: {
          legend: {
            display: false,
          }
        }
      }
    });

    const yearsChartLegend = document.getElementById('yearsChartLegend');
    yearsChartLegend.innerHTML = '';

    sortedYears.forEach(year => {
      const legendItem = document.createElement('div');
      legendItem.classList.add('legend-item');

      const span = document.createElement('span');
      span.textContent = `${year} лет: `;
      legendItem.appendChild(span);

      const strong = document.createElement('strong');
      strong.textContent = yearsCounts[year];
      legendItem.appendChild(strong);

      yearsChartLegend.appendChild(legendItem);
    });
  }



  function generateColor(existingColors, uniqueness) {
    function random(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    let h, s, l;
    let maxAttempts = 100;
    let attempt = 0;

    do {
      h = random(0, 360); // Генерация случайного оттенка
      s = random(50, 100); // Насыщенность от 50% до 100%
      l = random(20, 80); // Светлота от 20% до 80%
      attempt++;
    } while (
      attempt < maxAttempts &&
      (
        existingColors.some(color => colorSimilarity(color, `hsl(${h}, ${s}%, ${l}%)`) < uniqueness) ||
        (s <= 10 && l >= 90) // Игнорировать белые цвета
      )
    );

    return `hsl(${h}, ${s}%, ${l}%)`;
  }

  generateCharts();
</script>

</html>
