{% load static %}

<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{% static 'css/bootstrap/css/bootstrap.css' %}" />
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  <link rel="stylesheet" href="{% static 'css/fontawesome/css/all.css' %}" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>Tutors Diagram</title>
</head>

<body>
  <div class="container-fluid">
    <div class="col-md-6">
      <canvas id="barChart"></canvas>
    </div>
    <div class="row">

      <div class="col-md-6">
        <canvas id="doughnutChart"></canvas>
      </div>
    </div>
  </div>
</body>

<script>
  fetch('https://platonus-mark.medkrmu.kz/dashboard/tutors')
    .then(response => response.json())
    .then(data => {
      const filteredData = data.data.filter(item => item.has_access === "1");

      const cafedraCounts = {};
      const nameRuCounts = {};

      filteredData.forEach(item => {
        cafedraCounts[item.cafedraNameRu] = (cafedraCounts[item.cafedraNameRu] || 0) + 1;
        nameRuCounts[item.nameRu || "Преподаватель"] = (nameRuCounts[item.nameRu || "Преподаватель"] || 0) + 1;
      });

      const cafedraLabels = Object.keys(cafedraCounts);
      const cafedraData = Object.values(cafedraCounts);
      const nameRuLabels = Object.keys(nameRuCounts);
      const nameRuData = Object.values(nameRuCounts);

      const barChartCtx = document.getElementById('barChart').getContext('2d');
      const doughnutChartCtx = document.getElementById('doughnutChart').getContext('2d');

      const barChart = new Chart(barChartCtx, {
        type: 'bar',
        data: {
          labels: cafedraLabels,
          datasets: [{
            label: 'Количество преподавателей',
            data: cafedraData,
            backgroundColor: generateColors(cafedraLabels.length),
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false
        }
      });

      const doughnutChart = new Chart(doughnutChartCtx, {
        type: 'doughnut',
        data: {
          labels: nameRuLabels,
          datasets: [{
            label: 'Тип преподавателя',
            data: nameRuData,
            backgroundColor: generateColors(nameRuLabels.length),
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false
        }
      });

    })
    .catch(error => {
      console.error('Ошибка:', error);
    });

  function generateColors(count) {
    const colors = [];
    for (let i = 0; i < count; i++) {
      colors.push(generateColor());
    }
    return colors;
  }

  function generateColor() {
    function random(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    let r = random(0, 255);
    let g = random(0, 255);
    let b = random(0, 255);

    if ((r > 200 && g > 200 && b > 200) || (r < 100 && g < 100 && b < 100)) {
      return generateColor();
    }

    return `rgba(${r}, ${g}, ${b}, ${(random(35, 60) / 100)})`;
  }
</script>

</html>
