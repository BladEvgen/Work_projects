{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{% static 'css/bootstrap/css/bootstrap.css' %}" />
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  <link rel="stylesheet" href="{% static 'css/tutorStyle.css' %}" />
  <link rel="stylesheet" href="{% static 'css/fontawesome/css/all.css' %}" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>Tutors Diagram</title>
</head>

<body>
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-3">
        <div class="card">
          <div class="card-body p-0">
            <h5 class="card-title">Ученое звание</h5>
            <div class="chart-container">
              <canvas id="nameRuChart"></canvas>
            </div>
            <div class="legend-container" id="nameRuChartLegend"></div>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card">
          <div class="card-body p-0">
            <h5 class="card-title">Ставки</h5>
            <div class="chart-container">
              <canvas id="rateChart"></canvas>
            </div>
            <div class="legend-container" id="rateChartLegend"></div>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card">
          <div class="card-body p-0">
            <h5 class="card-title">Тенденция возраста у преподавателей</h5>
            <div class="chart-container">
              <canvas id="yearsChart"></canvas>
            </div>
            <div class="legend-container" id="yearsChartLegend" style="min-height: 250px;"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="row mt-4">
      <div class="col-lg-12">
        <div class="card">
          <div class="card-body m-0 p-0">
            <h5 class="card-title">Тенденция кафедр</h5>
            <div class="chart-container vh-100">
              <canvas id="cafedraChart"></canvas>
            </div>
            <div class="legend-container" id="cafedraChartLegend" style="display: none"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
<script defer src="{% static 'js/tutorchart.js' %}"></script>

</html>
