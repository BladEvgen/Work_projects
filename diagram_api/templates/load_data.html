{% extends "components/base.html" %}
{% block title %} Home {% endblock title %}

{% block main %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="form-container bg-secondary p-4 rounded">
                <h3 class="text-center text-light mb-4">Загрузите файл должников</h3>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-3">
                        <input type="file" id="file" name="file" class="form-control" required
                            accept=".xls,.xlsx,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Отправить</button>
                </form>
                {% if success %}
                <div id="success-message" class="d-flex justify-content-center alert alert-success mt-3">
                    {{ success }}
                </div>
                {% elif error %}
                <div class="d-flex justify-content-center alert alert-danger mt-3">
                    {{ error }}
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock main %}

<script>
    window.onload = function () {
        setTimeout(function () {
            var element = document.getElementById('success-message');
            if (element) {
                element.style.display = 'none';
            }
        }, 10000);
    };
</script>
