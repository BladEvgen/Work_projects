<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title></title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto&display=swap');

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            color: #fff;
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
        }

        h1,
        p {
            font-size: 4.5em;
            text-align: center;
            background: linear-gradient(90deg, #ff4081, #ff006e, #ff0054, #ff0040, #ff0000, #ff6f00, #ffbf00, #ffff00, #bfff00, #80ff00, #00ff00, #00ff80, #00ffbf, #00ffff, #00bfff, #0080ff, #0040ff, #0000ff, #4000ff, #8000ff, #bf00ff, #ff00ff, #ff00bf, #ff0080, #ff0040, #ff0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: colorChange 5s linear infinite;
        }

        p {
            font-size: 2.2em;
            text-align: center;
        }

        @keyframes colorChange {
            0% {
                background-position: 100% 0;
            }

            100% {
                background-position: -100% 0;
            }
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var content = document.querySelector('.content');
            function checkTime() {
                var date = new Date();
                var hours = date.getHours();
                if (hours >= 0 && hours < 15) {
                    content.style.display = 'block';
                } else {
                    content.style.display = 'none';
                }
            }
            checkTime();
            setInterval(checkTime, 1000);
            setInterval(function () {
                location.reload();
            }, 100000); // 3600000 Перезагрузка страницы каждый час
        });
    </script>
</head>

<body>

    <div class="content">
        <h1>С днем рождения, Александр Викторович!</h1>
        <p>От всего отдела ДОТ, мы хотим пожелать вам всего наилучшего в этот особенный день.</p>
    </div>

</body>

</html>
