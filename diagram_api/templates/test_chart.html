<!DOCTYPE html>
<html>

<head>
    <title>Line Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>

<body>
    <div class="container">
        <canvas id="myChart"></canvas>
    </div>

    <script>
        function generateColor() {
            function random(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            let r = random(0, 255);
            let g = random(0, 255);
            let b = random(0, 255);

            if ((r > 200 && g > 200 && b > 200) || (r < 100 && g < 100 && b < 100)) {
                return generateColor();
            }

            for (let color of generatedColors) {
                let [oldR, oldG, oldB] = color.match(/\d+/g).map(Number);
                if (Math.abs(r - oldR) + Math.abs(g - oldG) + Math.abs(b - oldB) < 255 * 0.55) {
                    return generateColor();
                }
            }

            let newColor = `rgba(${r}, ${g}, ${b}, ${random(60, 90) / 100})`;
            generatedColors.push(newColor);

            return newColor;
        }

        let generatedColors = [];

        function fetchData() {
            fetch('http://localhost:5000/api/get_marks/')
                .then(response => response.json())
                .then(data => {
                    let labels = Object.keys(data.tutor_diagram);
                    let datasets = labels.map((label, index) => {
                        return {
                            label: data.tutor_diagram[label].fullName,
                            data: data.tutor_diagram[label].marks,
                            fill: false,
                            borderColor: generateColor(),
                            tension: 0.1,
                            hidden: index >= 7
                        };
                    });

                    let ctx = document.getElementById('myChart');
                    let myChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: datasets
                        },
                        options: {
                            interaction: {
                                mode: 'index',
                                intersect: false,
                            },
                            plugins: {
                                legend: {
                                    position: 'top',
                                    labels: {
                                        filter: function (item, chart) {
                                            return item.datasetIndex < 7;
                                        }
                                    },
                                    onClick: function (e, legendItem) {
                                        var index = legendItem.datasetIndex;
                                        var ci = this.chart;
                                        var alreadyHidden = (ci.getDatasetMeta(index).hidden === null) ? false : ci.getDatasetMeta(index).hidden;

                                        ci.data.datasets.forEach(function (e, i) {
                                            var meta = ci.getDatasetMeta(i);

                                            if (i !== index) {
                                                if (!alreadyHidden) {
                                                    meta.hidden = true;
                                                } else if (meta.hidden === null) {
                                                    meta.hidden = true;
                                                }
                                            } else if (i === index) {
                                                meta.hidden = null;
                                            }
                                        });

                                        ci.update();
                                    }
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    title: {
                                        display: true,
                                        text: 'Оценки'
                                    }
                                },
                                x: {
                                    title: {
                                        display: true,
                                        text: 'Количество оценок'
                                    }
                                }
                            }
                        }
                    });
                })
                .catch(error => console.error('Error:', error));
        }

        window.onload = function () {
            fetchData();

            setInterval(() => {
                location.reload();
            }, 60 * 60 * 1000);
            setInterval(() => {
                fetchData();
            }, 30 * 60 * 1000);
        };

    </script>
</body>

</html>
