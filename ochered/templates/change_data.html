{% extends "components/base.html" %}
{% block title %} Change Data {% endblock title %}
{% load static %}
{% block main %}
<style>
  body {
    background: url("{% static 'media/Logo.svg' %}") no-repeat center center fixed;
    background-size: 950px;
    background-blend-mode: overlay;
    background-color: rgba(255, 255, 255, 0.8);
  }

  @media (max-width: 1200px) {
    body {
      background-size: 800px;
    }
  }

  @media (max-width: 992px) {
    body {
      background-size: 650px;
    }
  }

  @media (max-width: 768px) {
    body {
      background-size: 500px;
    }
  }

  @media (max-width: 576px) {
    body {
      background-size: 400px;
    }
  }

  .form-control:focus {
    border-color: #5cb85c;
    box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25);
  }

  .btn-primary {
    background-color: #5cb85c;
    border-color: #5cb85c;
  }

  .btn-primary:hover {
    background-color: #4cae4c;
    border-color: #4cae4c;
  }

  .btn-outline-secondary {
    border-color: #5cb85c;
    color: #5cb85c;
  }

  .btn-outline-secondary:hover {
    background-color: #5cb85c;
    color: #fff;
  }

  .progress {
    height: 20px;
    margin-bottom: 10px;
  }

  .progress-bar {
    transition: width 0.5s ease;
  }

  .form-text {
    font-size: 0.875rem;
  }

  .error-message {
    color: #d9534f;
    font-size: 0.875rem;
    margin-top: 10px;
  }

  .custom-form-label {
    font-weight: bold;
    color: #333;
  }

  .container {
    background-color: #f9f9f9;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
  }

  h2 {
    color: #5cb85c;
  }

  .input-group .form-control {
    border-right: 0;
  }

  .input-group-append {
    background-color: #fff;
  }

  .input-group-text {
    background-color: #fff;
    border-left: 0;
    cursor: pointer;
  }

  .input-group-text:hover {
    background-color: #e9ecef;
  }
</style>

<div class="container mt-5">
  <div>
    <h2 class="mb-4"><a href="{% url 'profile' username=request.user.username %}" class="text-primary back-icon">
        <i class="fa-solid fa-arrow-left"></i></a>
      Обновление данных
    </h2>

  </div>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="mb-3">
      <label for="first_name" class="form-label custom-form-label">Имя и Отчество:</label>
      <input type="text" name="first_name" id="first_name" class="form-control" value="{{ user.first_name }}">
    </div>

    <div class="mb-3">
      <label for="last_name" class="form-label custom-form-label">Фамилия:</label>
      <input type="text" name="last_name" id="last_name" class="form-control" value="{{ user.last_name }}">
    </div>

    <div class="mb-3 position-relative">
      <label for="password" class="form-label custom-form-label">Новый пароль:</label>
      <div class="input-group">
        <input type="password" name="password" id="password" class="form-control">
        <span class="input-group-text" id="togglePassword"><i class="fas fa-eye"></i></span>
      </div>
      <div class="progress">
        <div id="passwordStrength" class="progress-bar" role="progressbar" style="width: 0%;"></div>
      </div>
      <small id="passwordHelp" class="form-text text-muted"></small>
      <small id="passwordTip" class="form-text text-muted"></small>
    </div>

    <div class="mb-3 position-relative">
      <label for="confirm_password" class="form-label custom-form-label">Подтверждение пароля:</label>
      <div class="input-group">
        <input type="password" name="confirm_password" id="confirm_password" class="form-control">
        <span class="input-group-text" id="togglePassword"><i class="fas fa-eye"></i></span>
      </div>
      <small id="confirmPasswordHelp" class="form-text error-message"></small>
    </div>

    <button type="submit" id="registerBtn" class="btn btn-primary" disabled>Обновить данные</button>
  </form>
</div>
<script src="{% static 'js/validate_password.js' %}"></script>
{% endblock main %}
