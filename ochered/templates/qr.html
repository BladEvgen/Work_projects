{% extends "components/base.html" %}

{% block title %}Queue Registration{% endblock title %}

{% block main %}
{% load static %}
<style>
    .qr-container {
        margin-top: 5rem;
        text-align: center;
    }

    .qr-container h1 {
        font-size: 2rem;
        margin-bottom: 2rem;
    }

    .qr-container img {
        width: 50%;
        border-radius: 15px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .full-width-btn {
        display: block;
        width: 100%;
        height: 70px;
        margin-top: 20px;
        background-color: #28a745;
        border: none;
        border-radius: 30px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        color: white;
        font-size: 1.5rem;
        text-align: center;
        line-height: 70px;
        text-decoration: none;
        transition: background-color 0.3s ease;
    }

    .full-width-btn:hover {
        background-color: #218838;
    }
</style>

<div class="container qr-container">
    <h1>Отсканируйте QR или нажмите кнопку чтобы занять очередь</h1>
    <img src="{% static 'media/qr-code.png' %}" alt="QR Code" class="img-fluid">
    <a href="{% url 'register_ticket' %}" class="full-width-btn" target="_blank"><span class="fw-bolder p-2">Занять
            очередь</span></a>
</div>

{% endblock main %}
