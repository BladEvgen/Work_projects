<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Подписание файла</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dist/css/output.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='fontawesome/css/all.css') }}" />
  <style>
    :root {
      --progress-bar-color: #cfd8dc;
      --progress-value-color: #2196f3;
      --progress-empty-color-h: 4.1;
      --progress-empty-color-s: 89.6;
      --progress-empty-color-l: 58.4;
      --progress-filled-color-h: 122.4;
      --progress-filled-color-s: 39.4;
      --progress-filled-color-l: 49.2;
    }
  
    progress {
      width: 100%;
      height: 20px;
      border-radius: 10px;
      overflow: hidden;
    }

    progress::-webkit-progress-bar {
      background-color: #cfd8dc;
      border-radius: 10px;
    }

    progress::-webkit-progress-value {
      background-color: #2196f3;
      border-radius: 10px;
    }

    progress::-moz-progress-bar {
      background-color: #2196f3;
      border-radius: 10px;
    }
  
    .password-toggle {
      position: relative;
    }
  
    .toggle-password {
      position: absolute;
      top: 65%;
      right: 10px;
      transform: translateY(-50%);
      cursor: pointer;
    }
  
    .file-drop-area {
      position: relative;
      width: 100%;
      height: 100%;
      border: 2px dashed #4a5568;
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #2d3748;
      transition: background-color 0.3s ease;
    }
  
    .file-drop-area:hover {
      background-color: #4a5568;
    }
  
    .file-drop-area .file-msg {
      text-align: center;
    }
  
    .file-drop-area .file-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
  
    .alert-container {
      animation: fadeIn 0.5s ease-in-out, fadeOut 0.5s ease-in-out 3s forwards;
    }
  
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
  
      to {
        opacity: 1;
      }
    }
  
    @keyframes fadeOut {
      from {
        opacity: 1;
      }
  
      to {
        opacity: 0;
      }
    }
  .hidden {
    display: none;
  }

  </style>
</head>

<body class="bg-gray-900 text-white">
  <div class="form-container max-w-2xl mx-auto mt-10 px-4 py-8 bg-gray-800 rounded-lg shadow-lg">
    <form id="fileForm" enctype="multipart/form-data" class="flex flex-col items-center space-y-6">
      <!-- Dropdown Menu for Packages -->
      <div class="w-full max-w-md relative">
        <div id="dropdownMenuButton"
          class="inline-flex items-center w-full px-4 py-2 bg-gray-800 text-white rounded-md cursor-pointer hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-blue-500">
          <span class="truncate">Пакет сертификатов</span>
          <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-6-6-6 6"></path>
          </svg>
        </div>
        <div id="dropdownMenu"
          class="hidden absolute z-10 w-full max-w-md mt-1 overflow-hidden rounded-md shadow-lg bg-gray-800">
          <div class="flex items-center px-3 py-2">
            <input type="text" id="searchInput"
              class="w-full pl-3 ml-3 focus:outline-none focus:ring-1 focus:ring-blue-500 rounded-md text-black"
              placeholder="Поиск" autocomplete="off">
          </div>
          <ul class="max-h-60 overflow-y-auto rounded-md shadow-sm w-full">
            {% for package in packages %}
            <li tabindex="0" class="select-none rounded-b-md hover:bg-purple-500">
              <a href="#" class="block px-4 py-2 text-sm text-white package-option">{{ package }}</a>
            </li>
            {% endfor %}
          </ul>
        </div>
        <p id="selectedPackage" class="mt-2 text-sm text-gray-400"></p>
        <button type="button" id="downloadExcel"
          class="text-white bg-gradient-to-br from-pink-500 to-orange-400 hover:bg-gradient-to-bl focus:outline-none focus:ring-pink-200 dark:focus:ring-pink-800 font-medium rounded-lg text-sm px-5 py-2.5 text-center me-2 mb-2">
          Скачать Excel
          <i class="fa-solid fa-file-csv"></i>
        </button>
      </div>

      <!-- PDF Input -->
      <div class="w-full max-w-md" id="pdfInputContainer" hidden>
        <label for="fileInput" class="block text-sm text-gray-700 font-semibold mb-2">PDF файл</label>
        <div
          class="file-drop-area border-2 border-dashed border-green-400 p-4 rounded-lg cursor-pointer transition duration-200 ease-in-out hover:bg-green-50 hover:border-green-600 focus:outline-none focus:ring-2 focus:ring-green-600 focus:ring-opacity-50">
          <span class="file-msg text-green-600 font-medium">Нажмите или перетащите файл сюда</span>
          <input id="fileInput" type="file" class="file-input opacity-0 absolute inset-0 w-full h-full cursor-pointer"
            name="file" accept=".pdf" onchange="updateFileName(this)" required />
        </div>
        <p id="pdfFileName" class="mt-2 text-sm text-gray-700 truncate text-center"></p>
      </div>

      <!-- P12 Input -->
      <div class="w-full max-w-md">
        <label for="keyPath" class="block text-sm text-gray-400 mb-2">Файл ЭЦП (.p12)</label>
        <label for="keyPath"
          class="block w-full text-sm border border-gray-300 rounded-lg cursor-pointer bg-gray-700 hover:bg-gray-600 p-2 text-white">
          <input id="keyPath" type="file" class="hidden" name="keyPath" accept=".p12" onchange="updateFileName(this)"
            required />
          <span id="p12FileName" class="text-white-500">Выберите файл ЭЦП</span>
        </label>
        <span id="p12FileName" class="w-full text-sm text-gray-400 truncate"></span>
      </div>

      <!-- Password Input -->
      <div class="w-full max-w-md password-toggle relative">
        <label for="password" class="block text-sm font-medium mb-2">Пароль</label>
        <input type="password" id="password"
          class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
          placeholder="•••••••••" required />
        <i class="toggle-password far fa-eye-slash text-gray-400"></i>
      </div>

      <!-- Sign Button -->
      <div>
        <button type="button" onclick="signFiles()" id="signButton"
          class="text-white bg-gradient-to-r from-purple-500 via-purple-600 to-purple-700 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-purple-300 dark:focus:ring-purple-800 font-medium rounded-lg text-sm px-5 py-2.5 text-center me-2 mb-2">
          Подписать файлы
        </button>
      </div>

      <!-- Progress Bar -->
      <div id="progressContainer" class="w-full max-w-md hidden">
        <progress id="progressBar" value="0" max="100" class="w-full h-4"></progress>
        <p id="progressText" class="text-sm text-gray-400 mt-2"></p>
      </div>
    </form>
  </div>

  <!-- Error Alert -->
  <div id="alertContainer"
    class="alert-container bg-red-600 fixed top-8 left-1/2 transform -translate-x-1/2 p-4 rounded shadow-lg hidden">
    <span
      class="close-button text-white font-bold absolute top-2 right-4 text-lg cursor-pointer transition duration-300 hover:text-black">&times;</span>
    <strong class="block mb-2">Ошибка:</strong>
    <span id="alertMessage"></span>
  </div>

  <!-- Success Alert -->
  <div id="successContainer"
    class="alert-container bg-green-600 fixed top-8 left-1/2 transform -translate-x-1/2 p-4 rounded shadow-lg hidden">
    <span
      class="close-button text-white font-bold absolute top-2 right-4 text-lg cursor-pointer transition duration-300 hover:text-black">&times;</span>
    <strong class="block mb-2">Успешно:</strong>
    <span id="successMessage"></span>
  </div>
  <script>
    const dropdownMenuButton = document.getElementById('dropdownMenuButton');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const searchInput = document.getElementById('searchInput');
    const listItems = dropdownMenu.querySelectorAll('li');
    const pdfInputContainer = document.getElementById("pdfInputContainer");
    const selectedPackageElem = document.getElementById('selectedPackage');

    let selectedPackage = '';

    dropdownMenuButton.addEventListener('click', () => {
      dropdownMenu.classList.toggle('hidden');
    });

    searchInput.addEventListener('keyup', () => {
      const searchTerm = searchInput.value.toLowerCase();
      listItems.forEach(listItem => {
        const optionText = listItem.textContent.toLowerCase();
        listItem.classList.toggle('hidden', !optionText.includes(searchTerm));
      });
    });

    listItems.forEach(item => {
      item.addEventListener('click', (event) => {
        event.preventDefault();
        selectedPackage = event.target.textContent.trim();
        dropdownMenuButton.querySelector('span').textContent = selectedPackage;
        selectedPackageElem.textContent = `Выбран: ${selectedPackage}`;
        console.log(`Selected package: ${selectedPackage}`);
        dropdownMenu.classList.add('hidden');
        pdfInputContainer.classList.add('hidden');
        document.getElementById("fileInput").removeAttribute("required");
      });
    });

    document.getElementById('downloadExcel').addEventListener('click', function () {
      const selectedPackage = document.getElementById('selectedPackage').textContent.replace('Выбран: ', '').trim();
      if (!selectedPackage) {
        showAlert('Пожалуйста, выберите пакет.');
        return;
      }

      fetch('/download_excel', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ package: selectedPackage })
      })
        .then(response => {
          if (!response.ok) {
            throw new Error('Failed to download Excel file');
          }
          return response.blob();
        })
        .then(blob => {
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${selectedPackage}.xlsx`;
          document.body.appendChild(a);
          a.click();
          a.remove();
        })
        .catch(error => {
          console.error('Error downloading Excel file:', error);
          showAlert('Ошибка при скачивании файла. Попробуйте позже.');
        });
    });

    const passwordInput = document.getElementById("password");
    const togglePassword = document.querySelector(".toggle-password");

    togglePassword.addEventListener("click", function () {
      const type =
        passwordInput.getAttribute("type") === "text" ? "password" : "text";
      passwordInput.setAttribute("type", type);
      togglePassword.classList.toggle("fa-eye-slash");
      togglePassword.classList.toggle("fa-eye");
    });

    function updateFileName(input) {
      const fileName = input.files[0].name;
      const id = input.id === "fileInput" ? "pdfFileName" : "p12FileName";
      const colorClass =
        input.id === "fileInput" ? "text-white-500 text-lg" : "text-white-500";
      document.getElementById(
        id
      ).innerHTML = `<span class="${colorClass}">${fileName}</span>`;
    }
    let currentTaskId = null;

    async function signFiles() {
        try {
          console.log("Starting file signing process...");
          document.getElementById("signButton").disabled = true;

          const keyPath = document.getElementById("keyPath");
          const password = document.getElementById("password").value;

          if (!selectedPackage && (!keyPath.files.length || !password.trim())) {
            showAlert("Пожалуйста, заполните все поля формы.");
            document.getElementById("signButton").disabled = false;
            return;
          }

          const formData = new FormData();

          if (selectedPackage) {
            formData.append("package", selectedPackage);
          } else {
            const fileInput = document.getElementById("fileInput");

            if (!fileInput.files.length || fileInput.files[0].type !== "application/pdf") {
              showAlert("Пожалуйста, загрузите файл в формате PDF.");
              document.getElementById("signButton").disabled = false;
              return;
            }

            formData.append("file", fileInput.files[0]);
          }

          formData.append("keyPath", keyPath.files[0]);
          formData.append("password", password);

          const response = await fetch("/sign", {
            method: "POST",
            body: formData
          });

          if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.message || 'Ошибка при отправке запроса на подпись.');
          }

          const responseData = await response.json();
          const taskId = responseData.task_id;
          currentTaskId = taskId; 

          console.log("Task ID:", taskId);
          showSuccess("Процесс подписи запущен. Ожидайте...");

          document.getElementById("progressContainer").classList.remove("hidden");
          updateProgress(0, 'Начало обработки...');

          checkTaskStatus(taskId);

        } catch (error) {
          console.error("Error in signing files:", error);
          showAlert(
            "Произошла ошибка при подписи файлов: " + error.message
          );
          document.getElementById("signButton").disabled = false;
          resetProgressBar();
        }
      }

      function updateProgress(value, text) {
        const progressBar = document.getElementById("progressBar");
        const progressText = document.getElementById("progressText");
        progressBar.value = value;
        progressBar.style.setProperty('--progress-value', value);
        progressText.textContent = text;
      }

    function resetProgressBar() {
      const progressBar = document.getElementById("progressBar");
      const progressText = document.getElementById("progressText");
      progressBar.value = 0;
      progressText.textContent = '';
      document.getElementById("progressContainer").classList.add("hidden");
    }


    async function checkTaskStatus(taskId) {
        try {
          const response = await fetch(`/task_status/${taskId}`);
          if (!response.ok) {
            throw new Error('Ошибка при получении статуса задачи.');
          }
          const data = await response.json();

          console.log("Task status:", data);

          if (data.status === 'Pending') {
            updateProgress(50, 'Задача в очереди...');
            setTimeout(() => {
              if (currentTaskId === taskId) {
                checkTaskStatus(taskId);
              }
            }, 2000);
          } else if (data.status === 'Success') {
            updateProgress(100, 'Подпись завершена!');
            document.getElementById("signButton").disabled = false;

            let downloadLink = '';
            if (selectedPackage) {
              downloadLink = `https://certificates.medkrmu.kz/download?selected_path=${encodeURIComponent(selectedPackage)}`;
            } else {
              downloadLink = data.download_url || '#'; 
            }

            showSuccess(`Файлы успешно подписаны. Вы можете скачать их по <a href="${downloadLink}" target="_blank">ссылке</a>.`);

            setTimeout(() => {
              resetProgressBar();
            }, 4000);

          } else if (data.status === 'Error') {
            updateProgress(0, '');
            throw new Error(data.error || 'Ошибка при выполнении задачи.');
          } else {
            setTimeout(() => {
              if (currentTaskId === taskId) {
                checkTaskStatus(taskId);
              }
            }, 2000);
          }
        } catch (error) {
          console.error('Error checking task status:', error);
          showAlert('Произошла ошибка: ' + error.message);
          document.getElementById("signButton").disabled = false;
          resetProgressBar();
        }
      }


      function showAlert(message) {
        const alertContainer = document.getElementById("alertContainer");
        const alertMessage = document.getElementById("alertMessage");
        alertMessage.textContent = message;
        alertContainer.classList.remove("hidden");
      }

      function showSuccess(message) {
        console.log('showSuccess called with message:', message); 
        const successContainer = document.getElementById("successContainer");
        const successMessage = document.getElementById("successMessage");
        successMessage.innerHTML = message;
        successContainer.classList.remove("hidden");
        console.log('successContainer classes after removing hidden:', successContainer.className); 
      }

      document.getElementById("fileForm").addEventListener("submit", function (event) {
        event.preventDefault();
      });

      document.querySelectorAll(".close-button").forEach(function (button) {
        button.addEventListener("click", function () {
          if (this.closest("#alertContainer")) {
            document.getElementById("alertContainer").classList.add("hidden");
          }
          if (this.closest("#successContainer")) {
            document.getElementById("successContainer").classList.add("hidden");
          }
        });
      });

    const fileDropArea = document.querySelector('.file-drop-area');
    const fileInput = document.getElementById('fileInput');

    fileDropArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      fileDropArea.classList.add('bg-gray-600');
    });

    fileDropArea.addEventListener('dragleave', () => {
      fileDropArea.classList.remove('bg-gray-600');
    });

    fileDropArea.addEventListener('drop', (e) => {
      e.preventDefault();
      fileDropArea.classList.remove('bg-gray-600');
      const files = e.dataTransfer.files;
      if (files.length > 0 && files[0].type === "application/pdf") {
        fileInput.files = files;
        updateFileName(fileInput);
      }
      else {
        showAlert("Разрешается загружать только PDF-файлы.")
      }
    })
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (file && file.type !== 'application/pdf') {
        fileInput.value = '';
        showAlert("Разрешается загружать только PDF-файлы.");
      } else {
        updateFileName(fileInput);
      }
    });
  </script>
</body>

</html>
